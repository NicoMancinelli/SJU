name: Hermex macOS

on:
  push:
    branches: ["**"]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag (e.g. v0.1.0). Leave empty for a build-only run."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build Hermex.app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Resolve version
        id: version
        run: |
          RELEASE_TAG="${{ github.event.inputs.release_tag }}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "release_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ -n "$RELEASE_TAG" ]]; then
            echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
            echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "release_tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and package
        working-directory: HermexMac
        run: ./Packaging/package_app.sh "${{ steps.version.outputs.version }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hermex-macos
          path: |
            HermexMac/dist/*.zip
            HermexMac/dist/*.dmg

      - name: Publish GitHub Release
        if: steps.version.outputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          name: Hermex for Mac ${{ steps.version.outputs.release_tag }}
          files: |
            HermexMac/dist/*.zip
            HermexMac/dist/*.dmg
          generate_release_notes: true
          body: |
            Native macOS client for a self-hosted [hermes-webui](https://github.com/nesquena/hermes-webui) server — the Mac counterpart to [Hermex for iOS](https://github.com/uzairansaruzi/hermex).

            **Install:** download the `.dmg`, drag Hermex to Applications.

            The app is ad-hoc signed (not notarized). On first launch macOS will warn; either right-click → Open, or run:
            ```
            xattr -cr /Applications/Hermex.app
            ```
