name: Hermex macOS

on:
  push:
    branches: ["**"]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Hermex.app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and package
        working-directory: HermexMac
        run: ./Packaging/package_app.sh "${{ steps.version.outputs.version }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hermex-macos
          path: |
            HermexMac/dist/*.zip
            HermexMac/dist/*.dmg

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Hermex for Mac ${{ github.ref_name }}
          files: |
            HermexMac/dist/*.zip
            HermexMac/dist/*.dmg
          generate_release_notes: true
          body: |
            Native macOS client for a self-hosted [hermes-webui](https://github.com/nesquena/hermes-webui) server — the Mac counterpart to [Hermex for iOS](https://github.com/uzairansaruzi/hermex).

            **Install:** download the `.dmg`, drag Hermex to Applications.

            The app is ad-hoc signed (not notarized). On first launch macOS will warn; either right-click → Open, or run:
            ```
            xattr -cr /Applications/Hermex.app
            ```
